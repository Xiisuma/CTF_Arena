<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="CTF Arena — Capture the Flag">
  <title>CTF Arena — Capture the Flag</title>
  <defs>
    <linearGradient id="round-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1625"/>
      <stop offset="1" stop-color="#0d0b14"/>
    </linearGradient>
    <linearGradient id="round-flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="round-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <!-- Disque : tout le contenu tient dedans, les photos de profil rognent en cercle -->
  <circle cx="160" cy="160" r="160" fill="url(#round-bg)"/>
  <circle cx="160" cy="160" r="156.25" fill="none" stroke="url(#round-ring)" stroke-width="7.5"/>

  <g transform="translate(67.4 30.6) scale(2.9)">
    <!-- Mât -->
    <path d="M21 12.5 V53" stroke="#a78bfa" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="21" cy="10.5" r="2.1" fill="#a78bfa"/>

    <!-- Drapeau à queue d'aronde -->
    <path d="M22.6 14 H50 L43.5 24.5 L50 35 H22.6 Z" fill="url(#round-flag)"/>

    <!-- Accolades du format de flag, centrées dans le corps du drapeau -->
    <g stroke="#0d0b14" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path transform="translate(-4.7 0)" d="M32.9 17.6 q-2.4 0 -2.4 2.6 v1.8 q0 2.5 -2.2 2.5 q2.2 0 2.2 2.5 v1.8 q0 2.6 2.4 2.6"/>
      <path transform="translate(-0.4 0)" d="M38.3 17.6 q2.4 0 2.4 2.6 v1.8 q0 2.5 2.2 2.5 q-2.2 0 -2.2 2.5 v1.8 q0 2.6 -2.4 2.6"/>
    </g>

    <!-- Socle -->
    <path d="M14 53 H28" stroke="#8b5cf6" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>
  </g>

  <text x="160" y="226" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="38" font-weight="800" fill="#ffffff" letter-spacing="1.2">CTF Arena</text>
  <text x="160" y="253" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="600" fill="#a78bfa" letter-spacing="2.6">CAPTURE THE FLAG</text>
</svg>
