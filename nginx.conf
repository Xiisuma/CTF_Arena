
# Scheme réellement vu par le client. Derrière un terminateur TLS (Caddy,
# Cloudflare, ngrok), $scheme vaut "http" côté nginx alors que le client est
# en https : sans cette indirection, PHP poserait le cookie de session sans
# l'attribut Secure. En l'absence de proxy amont, on retombe sur $scheme.
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;

    # Derrière un tunnel ou un reverse proxy (ngrok, Caddy, Cloudflare), toutes
    # les requêtes arrivent depuis la passerelle Docker : sans ces directives,
    # PHP attribue le rate limiting à une seule et même IP, et cinq mauvais mots
    # de passe suffisent à bloquer la connexion pour tout le monde.
    # La confiance est limitée aux plages privées : un client qui joint nginx
    # directement ne peut pas se forger une IP.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité ──────────────────────────────────────────────────
    # 'unsafe-eval' requis par Zod v4 qui utilise new Function() pour les perfs.
    # 'unsafe-inline' retiré de script-src — Vite (prod) génère des bundles
    # qui n'ont pas besoin d'inline scripts. Tailwind CSS v4 injecte des styles
    # inline en dev uniquement ; en prod le CSS est bundlé dans un fichier.
    # Si une régression CSS apparaît en prod, ajouter 'unsafe-inline' à style-src
    # uniquement (jamais à script-src).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # HSTS uniquement significatif sur HTTPS — le navigateur l'ignore sur HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;

    location ~ ^/sql(/|$) {
        deny all;
        return 403;
    }

    # Proxy /api.php vers le backend PHP
    location /api.php {
        proxy_pass http://backend:80/api.php;
        proxy_set_header Host $host;
        # X-Real-IP = IP réelle du client (non falsifiable)
        proxy_set_header ngrok-skip-browser-warning "true";
        proxy_set_header X-Real-IP $remote_addr;
        # Vider X-Forwarded-For pour empêcher un client d'injecter une
        # fausse IP et contourner le rate limiting côté PHP.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_pass_request_body on;
        # Retry sur erreur/timeout — protège les requêtes GET pendant un restart backend
        # (uniquement pour les méthodes idempotentes, pas POST)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Proxy WebSocket /ws → ws-server:8080
    location /ws {
        proxy_pass http://ws-server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads {
        # Bloquer toute exécution PHP dans le dossier uploads
        location ~* \.php$ {
            deny all;
            return 403;
        }
        # Forcer le téléchargement — empêche les SVG/HTML d'être rendus dans le navigateur (XSS)
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://backend:80/uploads;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
